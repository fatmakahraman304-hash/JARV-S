name: FRIDAY identity and provider acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Existing UI and provider dependencies
        run: python -m pip install "PyQt6>=6.6,<7" numpy psutil pillow "httpx>=0.27,<1" requests
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Cross-device identity, speech commands and unchanged Aether API
        run: python -m unittest -v tests.test_friday_identity tests.test_persona tests.test_turkish_commands tests.test_aether_api_provider tests.test_aether_model_profiles tests.test_aether_visuals tests.test_friday_earth
      - name: Browser script syntax
        run: |
          for source in web/*.js dashboard/static/reactor.js; do node --check "$source"; done
