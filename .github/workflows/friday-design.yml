name: FRIDAY identity and cross-device design acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ["web/**", "dashboard/**", "gui/**", "core/identity.py", "memory/continuity.py", "tests/test_friday_identity.py", "tools/verify_friday_interfaces.py", ".github/workflows/friday-design.yml"]
permissions:
  contents: read
jobs:
  interfaces:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbcommon0 libgbm1
      - name: Install existing test dependencies
        run: python -m pip install "PyQt6>=6.6,<7" numpy psutil "playwright>=1.40,<2" "google-genai>=2.8,<3" pillow
      - name: Browser engines
        run: python -m playwright install --with-deps chromium firefox
      - name: Identity, compatibility and Qt layout regressions
        run: python -m unittest -v tests.test_friday_identity tests.test_friday_earth tests.test_restart_and_layout tests.test_second_brain_ui
      - name: Actual Qt desktop layout
        run: python tools/verify_friday_interfaces.py friday-design --qt-preview
      - name: Real browser layouts with private-data-free fixtures
        run: python tools/verify_friday_interfaces.py friday-design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friday-design-${{ matrix.os }}
          path: friday-design/
