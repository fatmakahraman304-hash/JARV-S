name: Hologram real-3D live check
on:
  push:
    branches: [feature/holo-real3d]
    paths: ["core/holo_ai3d.py", "core/glb.py", "tools/holo_ai3d_live.py", ".github/workflows/holo-ai3d-live.yml", "gui/holo_gl.py", "core/holo_model.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Display and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libopengl0 libglx-mesa0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-xkb1 libfontconfig1
      - run: python -m pip install "PyQt6>=6.6,<7" numpy pillow psutil gradio_client
      - name: Live
        env:
          QT_QPA_PLATFORM: xcb
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: xvfb-run -s "-screen 0 1920x1080x24" python tools/holo_ai3d_live.py out
