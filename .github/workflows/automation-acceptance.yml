name: FRIDAY browser automation acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/nihai-kabul-2026-11-25.md"
      - "actions/browser_control.py"
      - "actions/computer_control.py"
      - "tests/test_automation_consent.py"
      - "tests/test_browser_lifecycle.py"
      - "tests/test_computer_command_boundaries.py"
      - "tools/verify_browser_automation.py"
      - ".github/workflows/automation-acceptance.yml"
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install existing browser dependency
        run: python -m pip install "playwright>=1.40,<2"
      - name: Install browser engines and runtime
        run: python -m playwright install --with-deps chromium firefox
      - name: Browser deadlines and command boundaries
        run: python -m unittest -v tests.test_browser_lifecycle tests.test_computer_command_boundaries tests.test_automation_consent
      - name: Real Chromium and Firefox on isolated offline pages
        run: python tools/verify_browser_automation.py
