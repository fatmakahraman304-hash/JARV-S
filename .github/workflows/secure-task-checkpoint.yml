name: FRIDAY encrypted task checkpoint
on:
  pull_request:
    paths:
      - 'actions/background_tasks.py'
      - 'core/tasks/**'
      - 'core/neural_journal.py'
      - 'tests/test_secure_task_checkpoint.py'
      - '.github/workflows/secure-task-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "cryptography>=50,<51" "psutil>=5.9,<8"
      - run: python -m unittest -v tests.test_secure_task_checkpoint tests.test_task_store_atomic tests.test_neural_journal tests.test_cognitive_engine
