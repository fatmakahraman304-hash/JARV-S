name: AETHER identity migration
on:
  push:
    branches:
      - aether-rebrand-core
    paths:
      - .github/workflows/aether-rebrand.yml
      - tools/aether_migrate.py
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Replace obsolete names and references across tracked files
        run: python3 tools/aether_migrate.py
      - name: Validate Python sources
        run: python3 -m compileall -q actions core dashboard gui memory plugins providers tests tools main.py ui.py setup.py
      - name: Validate web animation
        run: |
          node --check web/reactor.js
          node --check web/app.js
          node --check dashboard/static/reactor.js
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor(aether): remove legacy assistant identities everywhere"
            git push origin HEAD:aether-rebrand-core
          fi
