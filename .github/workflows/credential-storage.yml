name: FRIDAY credential storage
on:
  workflow_dispatch:
  pull_request:
    paths: ["memory/**", "tests/test_secret_storage.py", "tools/credential_storage.py", "core/gemini.py", "core/llm_client.py", "core/image_studio.py", "actions/**", "config/__init__.py", "dashboard/**", "main.py", "gui/window.py", ".github/workflows/credential-storage.yml"]
permissions:
  contents: read
jobs:
  credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install existing test dependencies
        run: python -m pip install "cryptography>=42,<50" google-genai numpy psutil pillow qrcode
      - name: Profile-bound native protection and data-preserving migrations
        run: python -m unittest -v tests.test_secret_storage tests.test_config_safety tests.test_memory_process_lock tests.test_removed_abacus tests.test_removed_deepseek
