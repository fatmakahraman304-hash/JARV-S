name: AETHER web (GitHub Pages)

# The web AETHER for phones, tablets, TVs, projectors and watches: web/ plus the
# shared reactor core, published to https://<owner>.github.io/<repo>/ over
# HTTPS (which is what lets the microphone and camera work on every device).
on:
  push:
    branches: [main]
    paths: ["web/**", "dashboard/static/reactor.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp dashboard/static/reactor.js _site/reactor.js
          touch _site/.nojekyll
          echo "{\"version\": \"${GITHUB_SHA::12}\"}" > _site/version.json
          # every device loads this build's scripts, never a stale cached one
          sed -i -E "s#src=\"([a-z-]+\.js)\"#src=\"\1?v=${GITHUB_SHA::12}\"#g" _site/index.html
          grep -q "app.js?v=" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
