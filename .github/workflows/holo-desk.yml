name: FRIDAY Holo Desk native and hand inference
on:
  workflow_dispatch:
  pull_request:
    paths: ["core/holo_desk.py", "gui/holo_desk.py", "plugins/holo_desk.py", "gui/window.py", "ui.py", "tests/test_holo_desk.py", "tools/verify_holo_desk.py", ".github/workflows/holo-desk.yml"]
permissions:
  contents: read
jobs:
  spatial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install native and optional tracking dependencies
        run: python -m pip install "PyQt6>=6.6,<7" numpy psutil "mediapipe>=0.10.31,<0.11" "opencv-python>=4.8,<5" "opencv-contrib-python>=4.8,<5"
      - name: Linux native inference library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgles2 libegl1 libgl1
      - name: Workspace regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_holo_desk
      - name: Native render and real hand inference (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/verify_holo_desk.py holo-preview --tracking
      - name: Native render and real hand inference (Windows desktop)
        if: runner.os == 'Windows'
        run: python tools/verify_holo_desk.py holo-preview --tracking
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holo-desk-${{ matrix.os }}
          path: holo-preview/
