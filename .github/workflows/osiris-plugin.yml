name: FRIDAY regression tests
on:
  push:
    branches: [main, feature/osiris-world-command]
  pull_request:
    paths: ["plugins/**", "actions/**", "core/**", "gui/**", "dashboard/**", "memory/**", "providers/**", ".gitignore", "setup.py", "ui.py", "main.py", "requirements.txt", "integrations/osiris/**", "tools/*osiris.py", "tests/**", ".github/workflows/osiris-plugin.yml"]
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbcommon0 libgbm1
      - name: Install test dependencies
        run: python -m pip install "PyQt6>=6.6,<7" "PyQt6-WebEngine>=6.6,<7" "google-genai>=2.8.0,<3" psutil numpy pillow "packaging>=24,<27" "qrcode[pil]>=7,<9" "opencv-python-headless>=4.8,<5"
      - name: Compile application
        run: python -m compileall -q actions core dashboard gui memory plugins providers tools tests main.py setup.py ui.py
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Provider integration checks
        run: python -m providers._tests
