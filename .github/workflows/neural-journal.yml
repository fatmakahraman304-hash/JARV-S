name: FRIDAY encrypted neural journal
on:
  pull_request:
    paths:
      - 'core/neural_journal.py'
      - 'core/sync_hub.py'
      - 'tests/test_neural_journal.py'
      - 'tests/test_sync_delivery_reliability.py'
      - 'memory/secret_storage.py'
      - '.github/workflows/neural-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-checkpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install existing encryption dependency
        run: python -m pip install "cryptography>=50,<51"
      - name: Crash recovery, encryption and synchronization tests
        run: python -m unittest -v tests.test_neural_journal tests.test_sync_delivery_reliability tests.test_sync_hub tests.test_secret_storage
