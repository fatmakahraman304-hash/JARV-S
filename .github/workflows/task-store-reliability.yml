name: Task storage and updater reliability
on:
  pull_request:
    paths:
      - 'core/tasks/store.py'
      - 'core/app_updater.py'
      - 'tests/test_task_store_atomic.py'
      - 'tests/test_app_updater.py'
      - '.github/workflows/task-store-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reliability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install updater test dependency
        run: python -m pip install "packaging>=24,<27"
      - name: Task storage and update regressions
        run: python -m unittest -v tests.test_task_store_atomic tests.test_app_updater tests.test_package_first_update tests.test_prepared_update tests.test_startup_guard tests.test_named_routines
