name: FRIDAY Windows executive
on:
  pull_request:
    paths:
      - 'actions/windows_power.py'
      - 'agents/windows_power.md'
      - 'core/windows_executive.py'
      - 'core/executive_journal.py'
      - 'core/neural_journal.py'
      - 'core/cloud.py'
      - 'core/tasks/**'
      - 'dashboard/server.py'
      - 'dashboard/static/app.html'
      - 'tests/test_dashboard_task_status.py'
      - 'tests/test_windows_executive.py'
      - '.github/workflows/windows-executive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      FRIDAY_ALLOW_POWER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "cryptography>=50,<51" "psutil>=5.9,<8" "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1"
      - run: python -m unittest -v tests.test_dashboard_task_status tests.test_windows_executive tests.test_native_diagnostics tests.test_cognitive_engine tests.test_cognitive_review
