name: FRIDAY hardware privacy
on:
  pull_request:
    paths:
      - 'main.py'
      - 'core/hardware_privacy.py'
      - 'core/native_diagnostics.py'
      - 'tests/test_hardware_privacy.py'
      - 'tests/test_native_diagnostics.py'
      - '.github/workflows/hardware-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "psutil>=5.9,<8"
      - run: python -m unittest -v tests.test_hardware_privacy tests.test_native_diagnostics tests.test_cognitive_engine
