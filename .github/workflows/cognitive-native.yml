name: FRIDAY cognitive workflows and native diagnostics
on:
  pull_request:
    paths:
      - 'actions/background_tasks.py'
      - 'actions/native_diagnostics.py'
      - 'agents/system_diagnostics.md'
      - 'core/native_diagnostics.py'
      - 'core/tasks/**'
      - 'tests/test_cognitive_engine.py'
      - 'tests/test_cognitive_adaptive.py'
      - 'tests/test_cognitive_planner.py'
      - 'tests/test_native_diagnostics.py'
      - '.github/workflows/cognitive-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cognitive-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install existing diagnostics dependency
        run: python -m pip install "psutil>=5.9,<8"
      - name: Graph execution, interruption safety and native CIM
        run: python -m unittest -v tests.test_cognitive_adaptive tests.test_cognitive_planner tests.test_cognitive_engine tests.test_native_diagnostics tests.test_central_plans tests.test_task_store_atomic
