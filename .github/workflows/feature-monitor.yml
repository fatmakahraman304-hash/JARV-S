name: FRIDAY recurring feature monitor acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/feature_checks.py"
      - "core/second_brain.py"
      - "core/second_brain_service.py"
      - "gui/second_brain.py"
      - "plugins/second_brain.py"
      - "tests/test_feature_checks.py"
      - "tests/test_second_brain*.py"
      - ".github/workflows/feature-monitor.yml"
permissions:
  contents: read
jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Existing component dependencies
        run: python -m pip install "PyQt6>=6.6,<7" numpy psutil pillow "httpx>=0.27,<1" requests "google-genai>=2.8,<3"
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libnss3 libasound2t64
      - name: Actual isolated feature probes, negative cases and real Qt panel
        run: python -m unittest -v tests.test_feature_checks tests.test_second_brain_service tests.test_second_brain tests.test_second_brain_ui
