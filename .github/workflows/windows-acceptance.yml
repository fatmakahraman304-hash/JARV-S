name: AETHER Windows installation and HUD acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "setup.py"
      - "requirements.txt"
      - "main.py"
      - "ui.py"
      - "core/avatar.py"
      - "core/hologram_mesh.py"
      - "core/hologram_finish.py"
      - "gui/android_gl.py"
      - "gui/hologram_glsl.py"
      - "core/app_updater.py"
      - "core/startup_guard.py"
      - "tests/test_startup_guard.py"
      - "memory/config_manager.py"
      - "memory/process_lock.py"
      - "tests/test_config_safety.py"
      - "tests/test_memory_process_lock.py"
      - "core/restart_manager.py"
      - "gui/window.py"
      - "tests/test_updated_hud.py"
      - ".github/workflows/windows-acceptance.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install from the documented source entry point
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe setup.py
      - name: Open the first-run desktop window and close it normally
        shell: pwsh
        run: |
          $process = Start-Process -PassThru -FilePath ".\.venv\Scripts\pythonw.exe" -ArgumentList "main.py" -RedirectStandardError "$env:RUNNER_TEMP/aether-error.log"
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $windowOwner = $null
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) { throw "AETHER exited before displaying a window ($($process.ExitCode))" }
              # A Windows venv launcher can host the interpreter in a child.
              $processIds = @($process.Id) + @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($process.Id)" | Select-Object -ExpandProperty ProcessId)
              $windowOwner = Get-Process -Id $processIds -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero -and $_.MainWindowTitle -like 'FRIDAY*' } |
                Select-Object -First 1
            } until ($windowOwner -or [DateTime]::UtcNow -gt $deadline)
            if (-not $windowOwner) { throw "No native desktop window" }
            if (-not $windowOwner.CloseMainWindow()) { throw "AETHER did not accept a window close" }
            if (-not $process.WaitForExit(30000)) { throw "AETHER remained alive after window close" }
            if ($process.ExitCode -ne 0) { throw "AETHER exited with $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { $process.Kill($true) }
            Get-Content "$env:RUNNER_TEMP/aether-error.log" -Tail 30
          }
      - name: Verify the installed browser engines
        shell: python
        run: |
          import subprocess
          script = '''
          from playwright.sync_api import sync_playwright
          with sync_playwright() as browser_api:
              for engine in (browser_api.chromium, browser_api.firefox):
                  browser = engine.launch()
                  page = browser.new_page()
                  page.set_content("<title>AETHER acceptance</title>")
                  assert page.title() == "AETHER acceptance"
                  browser.close()
          '''
          subprocess.run([r".venv\Scripts\python.exe", "-c", script], check=True)
      - name: Reinstall and check dependency consistency
        run: |
          .\.venv\Scripts\python.exe setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
      - name: Verify update, rollback and reopened HUD
        run: .\.venv\Scripts\python.exe -m unittest -v tests.test_app_updater tests.test_startup_guard tests.test_updated_hud tests.test_restart_app tests.test_config_safety tests.test_memory_process_lock
