name: Hologram render check
on:
  pull_request:
    paths: ["gui/holo_gl.py", "gui/holo_panel.py", "core/holo_model.py", "tools/render_holo_preview.py", "tools/holo_samples.py", ".github/workflows/holo-render.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Linux display and Mesa OpenGL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libopengl0 libglx-mesa0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-xkb1 libfontconfig1
      - name: Install
        run: python -m pip install "PyQt6>=6.6,<7" numpy pillow psutil
      - name: Render (Linux, Mesa)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -s "-screen 0 1920x1080x24" python tools/render_holo_preview.py out --size 1400 --log-preview
      - name: Render (Windows, Qt software OpenGL)
        if: runner.os == 'Windows'
        env:
          QT_OPENGL: software
        run: python tools/render_holo_preview.py out --size 1400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holo-${{ matrix.os }}
          path: out/
