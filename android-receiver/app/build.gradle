plugins { id 'com.android.application' }

dependencies { implementation 'com.google.zxing:core:3.5.3' }

android {
    namespace 'com.aether.alici'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aether.alici'
        minSdk 24
        targetSdk 30          // sideloaded on TV boxes / projectors (Android 11 on the HY320)
        versionCode 14
        versionName '2.4'
    }
    buildTypes {
        // Release candidates are unsigned; protected CI signing is separate.
        release { minifyEnabled false }
        // Development installs cannot replace the user's release application.
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
